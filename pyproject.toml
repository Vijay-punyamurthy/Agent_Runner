[project]
name = "agent-runner"
version = "0.1.0"
description = "Durable, pausable agent runner on AWS (Step Functions + Lambda + DynamoDB)"
requires-python = ">=3.12"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[dynamodb,stepfunctions,server]>=5", "aws-cdk-lib>=2.140", "constructs>=10"]

[project.scripts]
runner = "agent_runner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/guard_mutation_check.py" = ["E501"]  # mutation targets must match source text exactly
